<script>window.DOCLY_CONFIG = { supabaseUrl:'https://fake.supabase.co', supabaseAnonKey:'fake' };</script>

<script>
// pull in the real page markup + styles, then the app
fetch('../index.html').then(r => r.text()).then(h => {
  const doc = new DOMParser().parseFromString(h, 'text/html');
  doc.querySelectorAll('head link, head style').forEach(n => document.head.appendChild(n));
  document.body.insertAdjacentHTML('beforeend', '<div id="app"></div><input type="file" id="fileIn" class="file-hidden">');
  const s = document.createElement('script'); s.src = '../js/app.js'; document.body.appendChild(s);
});
</script></body></html>
